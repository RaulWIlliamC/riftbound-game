<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riftbound · Sanctuary</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #14161d; color: #d9d4c6; font-family: monospace; }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; cursor: crosshair; }
    .label { position: absolute; top: 24px; left: 28px; pointer-events: none; }
    h1 { font-size: 18px; letter-spacing: 4px; margin: 0 0 8px; font-weight: normal; }
    .subtitle { color: #8a8994; font-size: 11px; }
    kbd { color: #e4ddcb; }
    #state { position: absolute; right: 28px; top: 26px; color: #b9b4c4; font-size: 12px; pointer-events: none; }
  .appearance {position:absolute;right:28px;top:52px;font-size:11px;color:#a3a0ab;}
    select {font:inherit;color:#ded8e4;background:#262631;border:1px solid #45434e;padding:5px 7px;}
  </style>
  <link rel="stylesheet" href="./src/hud/hud.css">
  <link rel="stylesheet" href="./src/hud/progression.css">
  <link rel="stylesheet" href="./src/multiplayer/panel.css">
<link rel="stylesheet" href="src/hud/rift-gate.css?v=destination-art-1"><link rel="stylesheet" href="src/hud/ruins-scene.css?v=ruins-polish-1"><link rel="stylesheet" href="src/hud/region-title.css"></head>
<body>
  <canvas id="game" aria-label="Riftbound ruined sanctuary and training yard. WASD moves, Shift runs, Q dashes, mouse aims and click swings the staff; hold over 0.3 seconds and release to fire elemental magic. Press 1 for spell one. Press or hold 2 for spell two; release to fire charged spells or throw tornado targets. Press 3 for third abilities; hold for Meteor Shower or Stone Collapse."></canvas>
  <div class="label"><h1>RIFTBOUND</h1><div class="subtitle">SANCTUARY · WASD MOVE · Q DASH · 1 / 2 / 3 SPELLS</div></div>
  <div id="state">IDLE · DASH READY</div>
  <label class="appearance">Element preview <select id="element" aria-label="Element appearance">
    <option value="neutral">Neutral</option><option value="water">Water</option><option value="earth">Earth</option>
    <option value="fire">Fire</option><option value="wind">Wind</option><option value="lightning">Lightning</option>
  </select></label>
  <button id="sound-toggle" aria-label="Toggle spell sounds" aria-pressed="true" style="position:absolute;right:28px;top:92px;background:#262631;color:#b9b4c4;border:1px solid #45434e;padding:5px 7px;font:10px monospace;cursor:pointer">SOUND ON</button>
  <div id="hud-root"></div>
  <script type="module" src="./src/main.js?v=map-library-1"></script>
</body>
</html>
